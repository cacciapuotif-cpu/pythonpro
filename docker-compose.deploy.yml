# Override esclusivamente per deploy/redeploy reali.
# Compose 2.24.4+ supporta !override: nessun sorgente host viene montato in
# /app, quindi backend, worker e scheduler eseguono esattamente l'immagine
# identificata dal commit di build.
services:
  backend:
    volumes: !override
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - exports_data:/app/exports

  arq_worker:
    volumes: !override
      - backend_uploads:/app/uploads

  backup_scheduler:
    volumes: !override
      - backend_backups:/app/backups

  check_scadenze_scheduler:
    volumes: !override []

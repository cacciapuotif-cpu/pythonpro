# ============================================================
# 📦 CONFIGURAZIONE PROGETTO - pyproject.toml
# ============================================================
# File di configurazione centrale per il progetto Python
# Gestisce metadata, linting e testing. Le dipendenze sono esclusivamente in
# requirements.txt, fonte autorevole condivisa da backend e worker.
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestionale-collaboratori"
version = "3.0.0"
description = "Sistema di gestione collaboratori, progetti formativi e presenze"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gestionale Team", email = "info@gestionale.local"}
]
keywords = ["formazione", "gestionale", "collaboratori", "progetti", "presenze"]

[project.urls]
Homepage = "https://github.com/yourusername/gestionale-collaboratori"
Documentation = "https://github.com/yourusername/gestionale-collaboratori/wiki"
Repository = "https://github.com/yourusername/gestionale-collaboratori"
Issues = "https://github.com/yourusername/gestionale-collaboratori/issues"

# ============================================================
# 🔧 CONFIGURAZIONE TOOL
# ============================================================

# --- RUFF (Linting e Formatting moderno) ---
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

# Directory da includere
src = ["app", "tests"]
include = ["*.py", "*.pyi"]

# File e directory da escludere
extend-exclude = [
    "__pycache__",
    ".venv",
    "venv",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "alembic/versions/*",
    "build",
    "dist",
]

[tool.ruff.lint]
# Regole da attivare
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # pylint
    "RUF",    # ruff-specific
]

# Regole da ignorare
ignore = [
    "E501",   # line-too-long (gestito dal formatter)
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    "B008",   # do-not-perform-function-call-in-argument-defaults (comune in FastAPI)
]

# Permetti fix automatici
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Permetti import non usati in __init__
"tests/**/*.py" = ["ARG", "PLR2004"]  # Rilassati nei test

[tool.ruff.format]
# Usa " per le stringhe
quote-style = "double"
# Usa Unix line endings
line-ending = "auto"
# Indentazione
indent-style = "space"
# Docstring
docstring-code-format = true

# --- BLACK (Formatting - backup se preferito) ---
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | alembic/versions
)/
'''

# --- ISORT (Import sorting) ---
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", "alembic/versions/*"]

# --- MYPY (Type checking) ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Graduale: false → true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true

# Plugin per SQLAlchemy
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Directory da escludere
exclude = [
    "venv",
    "alembic/versions",
    "__pycache__",
]

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "prometheus_fastapi_instrumentator.*",
    "schedule.*",
]
ignore_missing_imports = true

# --- PYTEST ---
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:/tmp/pythonpro_htmlcov",
    "--cov-report=xml:/tmp/pythonpro_coverage.xml",
]
cache_dir = "/tmp/pythonpro_pytest_cache"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# --- COVERAGE ---
[tool.coverage.run]
source = ["app"]
data_file = "/tmp/pythonpro_backend.coverage"
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/alembic/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "/tmp/pythonpro_htmlcov"

# --- BANDIT (Security) ---
[tool.bandit]
exclude_dirs = ["tests", "venv", "alembic/versions"]
skips = ["B101"]  # assert_used (ok nei test)

# ============================================================
# 📝 SCRIPTS
# ============================================================

[project.scripts]
gestionale-api = "app.main:run"

# ============================================================
# FINE CONFIGURAZIONE
# ============================================================
